[workspace]
members = [
  "crates/qcg-types",
  "crates/qcg-contract",
  "crates/qcg-expr-wasm",
  "crates/qcg-engine",
  "crates/qcg-steps",
  "crates/qcg-api",
  "crates/qcg-service",
  "crates/qcg-llm",
  "crates/qcg-mcp",
  "crates/qcg-llm-steps",
  "crates/qcg-server",
  "crates/qcg",
  "tests/integration",
]
resolver = "3"

[workspace.package]
edition = "2024"
description = "Contract-driven harness for bounded, purpose-specialized generation"
repository = "https://github.com/t-koba/qcg"
readme = "README.md"
rust-version = "1.88"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
camino = { version = "1", features = ["serde1"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dunce = "1"
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
ring = "0.17"
http = "1"
jsonschema = { version = "0.52", default-features = false }
keyring = "4.1.6"
libc = "0.2"
minijinja = { version = "2", features = ["loader", "json", "fuel"] }
mime = "0.3"
oauth2 = { version = "5", default-features = false }
pin-project-lite = "0.2"
regex = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.1.4", default-features = false, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sse-stream = "0.2"
semver = "1"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "time", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2"
wasm-bindgen = "0.2"
zip = { version = "4", default-features = false, features = ["chrono", "deflate"] }

[profile.release]
strip = "symbols"
