[package]
name = "qcg-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[[bin]]
name = "qcg_mcp_stdio_test_server"
path = "src/bin/qcg_mcp_stdio_test_server.rs"
required-features = ["mcp-test-server"]

[features]
default = ["mcp-oauth"]
mcp-oauth = ["dep:keyring", "dep:oauth2", "rmcp/auth"]
mcp-test-server = [
    "rmcp/server",
    "rmcp/transport-io",
    "rmcp/transport-streamable-http-server",
]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
keyring = { workspace = true, optional = true }
libc.workspace = true
oauth2 = { workspace = true, optional = true }
pin-project-lite.workspace = true
qcg-container = { path = "../qcg-container" }
qcg-policy = { path = "../qcg-policy" }
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sse-stream.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
