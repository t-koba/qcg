[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
camino.workspace = true
chrono.workspace = true
dunce.workspace = true
minijinja.workspace = true
policy = { path = "../policy" }
files = { path = "../files" }
api = { path = "../api" }
container = { path = "../container" }
contract = { path = "../contract" }
regex.workspace = true
llm = { path = "../llm" }
model = { path = "../model" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
libc.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
toml.workspace = true

[features]
# Test-only RunContext builder for downstream approval/resume tests (F02).
# Never enabled in production builds; only downstream dev-dependencies opt
# in so integration-style tests can drive real gateways without mocks.
test-support = []
