[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[features]
default = ["server-cors"]
server-cors = ["dep:tower-http"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
camino.workspace = true
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
libc.workspace = true
policy = { path = "../policy" }
api = { path = "../api" }
service = { path = "../service" }
model = { path = "../model" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
tower-http = { workspace = true, optional = true }

[dev-dependencies]
engine = { path = "../engine" }
service = { path = "../service", features = ["test-hooks"] }
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
