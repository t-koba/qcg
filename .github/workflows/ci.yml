name: CI

on:
  push:
    branches: [main, mizu]
  pull_request:
  workflow_dispatch:

jobs:
  # Shared Rust and distribution checks run on each supported OS to exercise
  # platform-specific filesystem/process behavior and bundle verification.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Mark Cargo cache start
        id: cargo-cache-start
        shell: bash
        run: echo "epoch_s=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Cache cargo
        id: cargo-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Record Cargo cache restore observation
        shell: bash
        env:
          CACHE_START_S: ${{ steps.cargo-cache-start.outputs.epoch_s }}
          CACHE_EXACT_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          ended_s="$(date +%s)"
          if [[ "$CACHE_START_S" =~ ^[0-9]+$ && "$ended_s" =~ ^[0-9]+$ ]]; then
            elapsed_s=$((ended_s - CACHE_START_S))
          else
            elapsed_s=unknown
          fi
          printf 'QCG_RUST_CACHE_EXACT_HIT=%s\n' "$CACHE_EXACT_HIT" >>"$GITHUB_ENV"
          printf 'QCG_RUST_CACHE_RESTORE_BRACKET_ELAPSED_S=%s\n' "$elapsed_s" >>"$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/generator/package-lock.json

      - name: Install verification dependencies
        run: npm --prefix frontend/generator ci --ignore-scripts

      - name: Shared core verification
        shell: bash
        run: bash scripts/check-core.sh

      - name: Install pinned wasm-bindgen CLI
        # The CLI rejects a library version it does not match, so derive the
        # version from Cargo.lock instead of hard-coding a second copy.
        shell: bash
        run: |
          VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Setup SPDX validator Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned SPDX validator
        run: python -m pip install -r scripts/requirements-spdx.txt

      - name: Verify extracted distribution
        shell: bash
        run: bash scripts/check-dist-bundle.sh --dependencies-installed

      # The evidence reader can fetch artifacts, but not step-summary files.
      - name: Upload core test timing summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qcg-test-time-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/qcg-test-time-${{ github.run_id }}-${{ github.run_attempt }}.md
          if-no-files-found: ignore

  # Generated API/WASM, dependency audit, type/unit checks, and production
  # build validate generated frontend inputs and production build outputs.
  demo-frontend:
    name: Demo frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/generator/package-lock.json

      - name: Install demo dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend/generator

      - name: Install pinned wasm-bindgen CLI
        # The CLI rejects a library version it does not match, so derive the
        # version from Cargo.lock instead of hard-coding a second copy.
        shell: bash
        run: |
          VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Generate API types
        run: npm run generate:api
        working-directory: frontend/generator

      - name: Generate expression WASM
        run: npm run generate:wasm
        working-directory: frontend/generator

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
        working-directory: frontend/generator

      - name: Check demo
        run: npm run check:api && npm run check && npm test && npm run build
        working-directory: frontend/generator

  # Browser smoke against the real server covers both Vite-proxy and served
  # assets modes; it complements the frontend's unit/build checks.
  e2e:
    name: Demo end-to-end
    needs: demo-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        # The CLI rejects a library version it does not match, so derive the
        # version from Cargo.lock instead of hard-coding a second copy.
        shell: bash
        run: |
          VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/generator/package-lock.json

      - name: Install demo dependencies and generate inputs
        run: npm ci --ignore-scripts && npm run generate:api && npm run generate:wasm
        working-directory: frontend/generator

      - name: Install Playwright
        run: |
          npm --prefix frontend/generator exec -- playwright install --with-deps chromium

      - name: UI Playwright smoke
        run: node scripts/e2e-ui-playwright.mjs

  # Compile-only minimum-toolchain floor; this job makes no runtime-test claim.
  msrv:
    name: Rust 1.99 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check workspace
        run: cargo check --workspace --locked

  # Dependency advisories, license/ban policy, and unused-dependency checks;
  # these are supply-chain gates rather than product-behavior tests.
  security:
    name: Security and dependency policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny
        run: cargo deny check

      - name: Cargo machete (unused dependencies)
        run: cargo machete
