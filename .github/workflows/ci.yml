name: CI

on:
  push:
    branches: [main, mizu]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/generator/package-lock.json

      - name: Install verification dependencies
        run: npm --prefix frontend/generator ci

      - name: Shared core verification
        shell: bash
        run: bash scripts/check-core.sh

      - name: Install pinned bundle tool
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Setup SPDX validator Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned SPDX validator
        run: python -m pip install -r scripts/requirements-spdx.txt

      - name: Verify extracted distribution
        shell: bash
        run: bash scripts/check-dist-bundle.sh --dependencies-installed

  demo-frontend:
    name: Demo frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/generator/package-lock.json

      - name: Install demo dependencies
        run: npm ci
        working-directory: frontend/generator

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Generate API types
        run: npm run generate:api
        working-directory: frontend/generator

      - name: Generate expression WASM
        run: npm run generate:wasm
        working-directory: frontend/generator

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
        working-directory: frontend/generator

      - name: Check demo
        run: npm run check:api && npm run check && npm test && npm run build
        working-directory: frontend/generator

  e2e:
    name: Demo end-to-end
    needs: demo-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/generator/package-lock.json

      - name: Install demo dependencies and generate inputs
        run: npm ci && npm run generate:api && npm run generate:wasm
        working-directory: frontend/generator

      - name: Install Playwright
        run: |
          npm --prefix frontend/generator exec -- playwright install --with-deps chromium

      - name: UI Playwright smoke
        run: node scripts/e2e-ui-playwright.mjs

  msrv:
    name: Rust 1.98 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --locked

  security:
    name: Security and dependency policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny
        run: cargo deny check

      - name: Cargo machete (unused dependencies)
        run: cargo machete
