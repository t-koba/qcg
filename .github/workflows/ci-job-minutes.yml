name: CI job minutes

# The reporter runs only after CI completes. It reads the trusted default
# branch, not the triggering run's branch or artifacts, and needs read access
# only to repository contents and Actions metadata.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, mizu]

permissions:
  actions: read
  contents: read

jobs:
  report:
    name: Report job minutes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'mizu'
    steps:
      - name: Checkout trusted default-branch reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Generate run and UTC-day job-minutes report
        env:
          GH_TOKEN: ${{ github.token }}
          QCG_REPO: ${{ github.repository }}
          QCG_RUN_ID: ${{ github.event.workflow_run.id }}
          QCG_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          QCG_BRANCH: ${{ github.event.workflow_run.head_branch }}
          QCG_OUT: qcg-job-minutes.md
        run: python3 scripts/ci-job-minutes.py

      - name: Upload job-minutes report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qcg-job-minutes-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: qcg-job-minutes.md
          if-no-files-found: error
