name: Release Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/product.mjs verify-version "$GITHUB_REF_NAME"

      - name: Install pinned wasm-bindgen CLI
        # The CLI rejects a library version it does not match, so derive the
        # version from Cargo.lock instead of hard-coding a second copy.
        shell: bash
        run: |
          VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Setup SPDX validator Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned SPDX validator
        run: python -m pip install -r scripts/requirements-spdx.txt

      - name: Build bundle
        shell: bash
        run: bash scripts/package-dist.sh --out-dir dist

      - name: Smoke-test bundle
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          test -n "$archive"
          bash scripts/check-dist-bundle.sh --archive "$archive"

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qcg-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
            dist/SHA256SUMS-*

  github-release:
    name: Publish GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.spdx.json
            dist/**/SHA256SUMS-*
