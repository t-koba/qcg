name: Release Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/product.mjs verify-version "$GITHUB_REF_NAME"

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Setup SPDX validator Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned SPDX validator
        run: python -m pip install -r scripts/requirements-spdx.txt

      - name: Build bundle
        shell: bash
        run: bash scripts/package-dist.sh --out-dir dist

      - name: Smoke-test bundle
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          test -n "$archive"
          bash scripts/check-dist-bundle.sh --archive "$archive"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: qcg-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
            dist/SHA256SUMS-*

  github-release:
    name: Publish GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.spdx.json
            dist/**/SHA256SUMS-*
