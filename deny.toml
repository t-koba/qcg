[advisories]
version = 2
yanked = "deny"
# These are maintenance-only notices, not vulnerability advisories. They come
# from the Linux Secret Service backend in keyring 4.2.0, whose current upstream
# release still uses the zbus 5 crate family. No zbus-6-compatible keyring or
# backend release is published yet; remove these exceptions when it migrates.
ignore = [
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.4 is required by keyring 4.2.0's Linux Secret Service backend; maintenance-only notice, no compatible upstream migration release yet." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.0 is required by keyring 4.2.0's Linux Secret Service backend; maintenance-only notice, no compatible upstream migration release yet." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15.0 is required by keyring 4.2.0's Linux Secret Service backend; maintenance-only notice, no compatible upstream migration release yet." },
  # These are use-site exceptions, not patched crates. The CLI's only RSA/EC
  # use is public ID-token verification through openidconnect. In
  # crates/cli/src/cli/auth/oauth.rs, clients have no secret and token
  # validation uses id_token_verifier / claims; qcg passes or stores no RSA/EC
  # private key and performs no secret-key
  # signing/decryption. Reassess if auth adds private-key operations or the
  # dependency chain changes; remove when a compatible fixed chain is available.
  { id = "RUSTSEC-2023-0071", reason = "Marvin affects RSA private-key timing. qcg's only rsa consumer is CLI openidconnect ID-token verification using public issuer keys; no RSA private key is held or used. Reassess if auth adds private-key operations or the dependency path changes." },
  { id = "RUSTSEC-2026-0387", reason = "Affected crypto-bigint operations leak secret integers through timing. qcg's only crypto-bigint consumer is CLI openidconnect EC ID-token verification using public issuer keys and signatures; qcg has no EC private key or secret-integer arithmetic. Reassess if this use changes or a compatible fixed chain becomes available." },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
