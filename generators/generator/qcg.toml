[[flow]]
id = "ask_purpose"
type = "ask_user"

[flow.params]
content = "Describe the generator you want to build (its purpose)."
fields = [
    { id = "description", type = "text", required = true },
]

[[flow]]
id = "ask_design_mode"
needs = ["ask_purpose"]
type = "ask_user"

[flow.params]
content = "How should the design be produced?"
options = [
    "llm",
    "manual",
]

[[flow]]
id = "design_proposal"
needs = ["ask_design_mode"]
output = "design_out"
type = "llm.fill"
when = "steps.ask_design_mode.output == 'llm'"

[flow.params]
prompt = "prompts/design.j2"
schema = "schemas/design.schema.json"
max_iterations = 5

[[flow]]
id = "ask_manual_form"
needs = ["ask_design_mode"]
type = "ask_user"
when = "steps.ask_design_mode.output == 'manual'"

[flow.params]
content = "Manual design: fill every detail of the generated generator."
fields = [
    { id = "generator_id", type = "string", required = true, pattern = "^[a-z][a-z0-9_-]*$" },
    { id = "generator_name", type = "string", required = true },
    { id = "artifact_path", type = "string", required = true, default = "README.md" },
    { id = "primary_step_type", type = "select", options = ["write", "render", "llm.fill"], default = "write", required = true },
    { id = "design_json", type = "json", required = true },
    { id = "include_readme", type = "boolean", default = false, required = true },
]

[[flow]]
id = "ask_manual_render_details"
needs = ["ask_manual_form"]
type = "ask_user"
when = "steps.ask_design_mode.output == 'manual' && !steps.ask_manual_form.output.design_json.package && steps.ask_manual_form.output.primary_step_type == 'render'"

[flow.params]
content = "Manual render design: provide the artifact template content."
fields = [
    { id = "artifact_content", type = "text", required = true, default = "# Generated by qcg" },
]

[[flow]]
id = "ask_manual_llm_details"
needs = ["ask_manual_form"]
type = "ask_user"
when = "steps.ask_design_mode.output == 'manual' && !steps.ask_manual_form.output.design_json.package && steps.ask_manual_form.output.primary_step_type == 'llm.fill'"

[flow.params]
content = "Manual LLM design: provide the prompt instructions and provider model."
fields = [
    { id = "prompt_instructions", type = "text", required = true, default = "Generate the requested artifact." },
    { id = "llm_provider", type = "string", required = true },
    { id = "llm_model", type = "string", required = true },
]

[[flow]]
id = "ask_fs_write"
needs = [
    "design_proposal",
    "ask_manual_form",
    "ask_manual_render_details",
    "ask_manual_llm_details",
]
type = "ask_user"
on_deps = "none_failed"

[flow.params]
content = "Select fs_write permission for the generated generator."
options = [
    "none",
    "workspace",
]

[[flow]]
id = "ask_network"
needs = ["ask_fs_write"]
type = "ask_user"

[flow.params]
content = "Select network permission for the generated generator."
options = [
    "none",
    "example.com",
]

[[flow]]
id = "ask_commands"
needs = ["ask_network"]
type = "ask_user"

[flow.params]
content = "Select command permission for the generated generator."
options = [
    "none",
    "cc",
]

[[flow]]
id = "ask_containers"
needs = ["ask_commands"]
type = "ask_user"

[flow.params]
content = "Select container permission for the generated generator."
options = [
    "none",
    "nginx",
]

[[flow]]
id = "ask_side_effects"
needs = ["ask_containers"]
type = "ask_user"

[flow.params]
content = "Select side effect policy for the generated generator."
options = [
    "none",
    "confirm",
    "dry_run_first",
]

[[flow]]
id = "ask_secrets"
needs = ["ask_side_effects"]
type = "ask_user"

[flow.params]
content = "Select secret declarations for the generated generator."
options = [
    "none",
    "api_token",
]

[[flow]]
id = "bp_render_package"
needs = ["ask_secrets"]
type = "render"
when = "(steps.ask_design_mode.output == 'manual' && steps.ask_manual_form.output.design_json.package) || (steps.ask_design_mode.output == 'llm' && steps.design_out.output.package)"

[flow.params]
output_file = "blueprint-package.json"
template = "templates/blueprint-package.json.j2"

[[flow]]
id = "bp_check_package"
needs = ["bp_render_package"]
type = "check.schema"

[flow.params]
source = "blueprint-package.json"
schema = "schemas/design.schema.json"

[[flow]]
id = "bp_render_base"
needs = ["bp_check_package"]
type = "render"

[flow.params]
output_file = "blueprint-base.json"
template = "templates/blueprint-base.json.j2"

[[flow]]
id = "bp_render_overlay"
needs = ["bp_render_base"]
type = "render"

[flow.params]
output_file = "blueprint-overlay.json"
template = "templates/builder-overlay.json.j2"

[[flow]]
id = "bp_merge_manifest"
needs = ["bp_render_overlay"]
type = "transform"

[flow.params]
transform = "json_merge"
source = "blueprint-overlay.json"
with = "blueprint-base.json"
target = "blueprint-merged.json"

[[flow]]
id = "bp_to_toml"
needs = ["bp_merge_manifest"]
type = "transform"

[flow.params]
transform = "json_to_toml"
source = "blueprint-merged.json"
target = "generator/qcg.toml"

[[flow]]
id = "bp_write_sources_manual"
needs = ["bp_to_toml"]
type = "foreach"
when = "steps.ask_design_mode.output == 'manual' && steps.ask_manual_form.output.design_json.package"

[flow.params]
items = "steps.ask_manual_form.output.design_json.package.sources"
subflow = "write_source"
max_iterations = 64
parallel = 2

[[flow]]
id = "bp_write_sources_llm"
needs = ["bp_to_toml"]
type = "foreach"
when = "steps.ask_design_mode.output == 'llm' && steps.design_out.output.package.sources"

[flow.params]
items = "steps.design_out.output.package.sources"
subflow = "write_source"
max_iterations = 64
parallel = 2

[[flow]]
id = "render_manifest"
needs = ["ask_secrets"]
type = "render"
when = "steps.ask_design_mode.output == 'manual' && !steps.ask_manual_form.output.design_json.package"

[flow.params]
output_file = "generator/qcg.toml"
template = "templates/qcg.toml.j2"

[[flow]]
id = "write_render_template"
needs = ["render_manifest"]
type = "write"
when = "steps.ask_design_mode.output == 'manual' && steps.ask_manual_form.output.primary_step_type == 'render' && !steps.ask_manual_form.output.design_json.package"

[flow.params]
content = "{{ steps.ask_manual_render_details.output.artifact_content }}"
output_file = "generator/templates/artifact.txt.j2"

[[flow]]
id = "render_readme"
needs = ["render_manifest"]
type = "render"
when = "steps.ask_design_mode.output == 'manual' && steps.ask_manual_form.output.include_readme && !steps.ask_manual_form.output.design_json.package"

[flow.params]
output_file = "generator/README.md"
template = "templates/README.md.j2"

[[flow]]
id = "render_prompt_stub"
needs = ["render_manifest"]
type = "render"
when = "steps.ask_design_mode.output == 'manual' && steps.ask_manual_form.output.primary_step_type == 'llm.fill' && !steps.ask_manual_form.output.design_json.package"

[flow.params]
output_file = "generator/prompts/fill.j2"
template = "templates/prompt.j2"

[[flow]]
id = "render_schema_stub"
needs = ["render_manifest"]
type = "render"
when = "steps.ask_design_mode.output == 'manual' && steps.ask_manual_form.output.primary_step_type == 'llm.fill' && !steps.ask_manual_form.output.design_json.package"

[flow.params]
output_file = "generator/schemas/fill.schema.json"
template = "templates/fill.schema.json.j2"

[[flow]]
id = "render_skill"
needs = ["render_manifest"]
on_deps = "none_failed"
type = "render"
artifact = { label = "Generated skill", required = false }
when = "steps.ask_design_mode.output == 'manual' && !steps.ask_manual_form.output.design_json.package"

[flow.params]
output_file = "generator/SKILL.md"
template = "templates/SKILL.md.j2"

[[flow]]
id = "check_generated"
needs = [
    "render_manifest",
    "write_render_template",
    "render_prompt_stub",
    "render_schema_stub",
    "render_skill",
    "render_readme",
    "bp_check_package",
    "bp_to_toml",
    "bp_write_sources_manual",
    "bp_write_sources_llm",
]
on_deps = "none_failed"
type = "check.contract"

[flow.params]
source = "generator"

[generator]
description = "Builds a qcg generator while keeping permissions user-selected"
id = "generator"
name = "Generator"
qcg_version = "^0.1"
version = "0.1.0"

[assets]
dirs = ["ui"]
meta = { entry = "ui/index.html" }

[llm]
max_tokens = 16384
temperature = 0.0

[llm.model]
model = "fake"
provider = "fake"

[permissions]

[[outputs.extras]]
label = "Generated manifest"
glob = "generator/qcg.toml"
required = true

[[blocks.write_source]]
id = "write_source"
type = "write"

[blocks.write_source.params]
content = "{{ item.value }}"
output_file = "generator/{{ item.key }}"
