[[flow]]
id = "fill"
output = "filled"
type = "llm.fill"
artifact = { label = "Result", required = true }

[flow.params]
max_iterations = 2
max_tokens_total = 2048
output_file = "result.json"
prompt = "prompts/fill.j2"
schema = "schemas/fill.schema.json"

[generator]
description = "Retries invalid structured LLM output and writes validated JSON to a file."
id = "llm-fill-retry"
name = "LLM Fill Retry"
version = "0.1.0"

[llm]
max_tokens = 512
temperature = 0.0

[llm.model]
model = "fake"
provider = "fake"

[permissions]
fs_read = []
network = []
commands = []
side_effects = "none"
side_effects_scope = "invocation"
fs_write = ["workspace"]

[permissions.containers]
enabled = false
