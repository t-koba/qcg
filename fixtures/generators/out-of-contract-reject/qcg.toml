[failure.by_kind]
out_of_contract = "reject"

[[flow]]
id = "fill"
output = "result"
type = "llm.fill"

[flow.params]
max_iterations = 1
prompt = "prompts/fill.j2"
schema = "schemas/result.schema.json"

[generator]
description = "Rejects an LLM response marked out of contract"
id = "out-of-contract-reject"
name = "Out Of Contract Reject"
qcg_version = "^0.1"
version = "0.1.0"

[llm]
max_tokens = 128
temperature = 0.0

[llm.model]
model = "fake"
provider = "fake"
