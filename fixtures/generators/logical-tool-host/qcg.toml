[[flow]]
id = "write_config"
type = "write"
artifact = { label = "qpx config", required = true }

[flow.params]
content = """
routes: []
"""
output_file = "qpx.yaml"

[[flow]]
id = "validate_config"
type = "check.tool"

[flow.params]
input = "qpx.yaml"
tool = "qpx_validate"

[generator]
description = "Exercises check.tool with an explicit host validator backend."
id = "logical-tool-host"
name = "Logical Tool Host"
qcg_version = "^0.1"
version = "0.1.0"

[permissions]
fs_read = ["workspace"]
fs_write = ["workspace"]

[[permissions.commands]]
args = [
    "hash-object",
    "*",
]
bin = "git"
purpose = "validate that qpx.yaml exists"
isolation = "trusted_host"

[tools.qpx_validate]
command = [
    "git",
    "hash-object",
    "{input}",
]
input = "qpx.yaml"
kind = "validator"
network = "none"
timeout_seconds = 30
workspace = "read_only"

[tools.qpx_validate.backends.host]
bin = "git"
version_command = [
    "git",
    "--version",
]

[tools.qpx_validate.resolution]
allowed_backends = ["host"]
fallback = "explicit"
preferred_backends = ["host"]
