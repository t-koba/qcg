[[flow]]
id = "write_config"
type = "write"
artifact = { label = "qpx config", required = true }

[flow.params]
content = """
routes: []
"""
output_file = "qpx.yaml"

[[flow]]
id = "validate_config"
type = "check.tool"

[flow.params]
input = "qpx.yaml"
tool = "qpx_validate"

[generator]
description = "Exercises check.tool with an explicit host validator backend."
id = "logical-tool-host"
name = "Logical Tool Host"
qcg_version = "^0.1"
version = "0.1.0"

[permissions]
network = []
side_effects = "none"
side_effects_scope = "invocation"
fs_read = ["workspace"]
fs_write = ["workspace"]

[[permissions.commands]]
args = [
    "hash-object",
    "*",
]
bin = "git"
purpose = "validate that qpx.yaml exists"
isolation = "trusted_host"


[permissions.containers]
enabled = false
[tools.qpx_validate]
command = [
    "git",
    "hash-object",
    "{input}",
]
input = "qpx.yaml"
kind = "validator"
network = "none"
timeout_seconds = 30
# No workspace snapshot so the host argv stays relative and matches the
# wildcard permission: snapshot absolutes never match `*` under the
# absolute-path safety rule (E13 vs wildcard safety conflict, reported).
workspace = "none"

[tools.qpx_validate.backends.host]
bin = "git"

[tools.qpx_validate.resolution]
allowed_backends = ["host"]
fallback = "explicit"
preferred_backends = ["host"]
