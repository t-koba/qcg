[[flow]]
id = "seed"
type = "write"

[flow.params]
content = """alpha
beta
gamma"""
output_file = "notes.txt"

[[flow]]
id = "inspect"
type = "read_anchored"
needs = ["seed"]

[flow.params]
path = "notes.txt"
limit = 10

[[flow]]
id = "edit"
type = "patch"
needs = ["seed"]
artifact = { label = "Notes", required = true, mime = "text/plain" }

[flow.params]
target = "notes.txt"
expected_base_sha256 = "f3220283d05d1ff2ae350cfe9e0e367cb5aef46e10efb203c8a53c678e2218c8"

[[flow.params.edits]]
op = "replace"
anchor = "2:015cadfe"
lines = ["BETA"]

[generator]
description = "Deterministic hash-anchored patch example"
id = "anchored-patch"
name = "Anchored Patch"
qcg_version = "^0.1"
version = "0.1.0"

[[inputs.stages]]
id = "basic"

[permissions]
fs_read = ["workspace"]
network = []
commands = []
side_effects = "none"
side_effects_scope = "invocation"
fs_write = ["workspace"]

[permissions.containers]
enabled = false
