[[flow]]
id = "manifest"
type = "write"
artifact = { label = "Bundle manifest", required = true }

[flow.params]
content = """
{"name":"archive-bundle","version":"0.1.0"}
"""
output_file = "bundle/manifest.json"

[[flow]]
id = "readme"
type = "write"
artifact = { label = "Bundle README", required = true }

[flow.params]
content = """
# Archive Bundle
"""
output_file = "bundle/README.md"

[generator]
description = "Produces multiple artifacts that can be downloaded as a run archive."
id = "archive-bundle"
name = "Archive Bundle"
qcg_version = "^0.1"
version = "0.1.0"

[permissions]
fs_write = ["workspace"]
