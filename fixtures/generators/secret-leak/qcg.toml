[[flow]]
id = "draft"
type = "llm.generate"
artifact = { label = "Output", required = true }

[flow.params]
output_file = "out.txt"
prompt = "prompts/draft.j2"

[generator]
description = "Negative fixture: prompt contains a secret value and must fail"
id = "secret-leak"
name = "Secret Leak"
version = "0.1.0"

[llm]
max_tokens = 512

[llm.model]
model = "fake"
provider = "fake"

[permissions]
fs_read = []
fs_write = []
network = []
commands = []
side_effects = "none"
side_effects_scope = "invocation"


[permissions.containers]
enabled = false
[secrets.api_token]
env = "TEST_TOKEN"
