[[flow]]
id = "write_generator"
type = "write"
artifact = { label = "Generated contract", required = true }

[flow.params]
content = '''
[generator]
id = "generated-minimal"
name = "Generated Minimal"
version = "0.1.0"
qcg_version = "^0.1"
description = "Generated by contract-check"

[permissions]

[[flow]]
id = "readme"
type = "write"
artifact = { label = "README", required = true }

[flow.params]
output_file = "README.md"
content = "# Generated Minimal\n"

'''
output_file = "generator/qcg.toml"

[[flow]]
id = "validate_generator"
type = "check.contract"

[flow.params]
source = "generator"

[generator]
description = "Writes a minimal generator and validates it with check.contract."
id = "contract-check"
name = "Contract Check"
version = "0.1.0"
qcg_version = "^0.1"

[permissions]
