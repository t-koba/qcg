[failure.by_kind]
out_of_contract = "reject"

[[flow]]
id = "agent"
output = "result"
type = "llm.agent"

[flow.params]
max_iterations = 1
max_tokens_total = 4096
prompt = "prompts/agent.j2"

[generator]
description = "Rejects an llm.agent final response marked out of contract"
id = "out-of-contract-agent-reject"
name = "Out Of Contract Agent Reject"
qcg_version = "^0.1"
version = "0.1.0"

[llm]
max_tokens = 128
temperature = 0.0

[llm.model]
model = "fake"
provider = "fake"
