[[flow]]
id = "guide"
type = "write"
artifact = { label = "Guide", required = true }

[flow.params]
content = """
# {{ inputs.title }}

{{ inputs.summary }}
"""
output_file = "docs/guide.md"

[generator]
description = "Writes a small documentation artifact from structured inputs."
id = "doc-writer"
name = "Doc Writer"
qcg_version = "^0.1"
version = "0.1.0"

[[inputs.stages]]
id = "doc"

[[inputs.stages.fields]]
default = "Operator Guide"
id = "title"
required = true
type = "string"

[[inputs.stages.fields]]
default = "This document was generated by qcg."
id = "summary"
required = true
type = "text"

[permissions]
